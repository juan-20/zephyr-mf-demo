name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Zephyr environment to deploy the shell to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a deploy half way; superseded pull request runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Turborepo needs history to compare against the base commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - name: Typecheck and test
        run: npx turbo run typecheck test

  deploy:
    name: Deploy to Zephyr
    needs: check
    # Pull requests are checked, never deployed: the shell resolves remotes by tag, so a
    # deploy from an unreviewed branch could end up serving real traffic.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
      # Pushes land in staging; run this workflow manually to deploy the shell to production.
      # Deploying through CI (not only promoting in the dashboard) is what writes the remote
      # dependencies into the environment manifest.
      SHELL_ZE_ENV: ${{ inputs.environment || 'staging' }}
      # Remotes always deploy to their staging environment; the shell follows them.
      ZE_ENV: staging
      # Build-time fallback only. Each environment overrides it in the Zephyr dashboard.
      ZE_PUBLIC_API_URL: https://zephyr-mf-demo-api-staging.onrender.com
    steps:
      # The Zephyr plugin only logs auth errors and exits 0, so fail loudly here.
      - name: Require Zephyr CI token
        run: test -n "$ZE_CI_TOKEN" || { echo "ZE_CI_TOKEN secret is not set"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Zephyr reads git metadata (org, project, branch)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The shell lists its remotes as dependencies, so Turborepo deploys them first and
      # redeploys the shell whenever one of them changes. A push deploys only what changed
      # since the previous commit; a manual run deploys everything.
      - name: Deploy affected apps
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            npx turbo run deploy --only --filter="...[$BEFORE]"
          else
            npx turbo run deploy
          fi
