name: Deploy to Zephyr

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Zephyr environment to deploy the shell to
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ZE_CI_TOKEN: ${{ secrets.ZE_CI_TOKEN }}
    steps:
      # The Zephyr plugin only logs auth errors and exits 0, so fail loudly here.
      - name: Require Zephyr CI token
        run: test -n "$ZE_CI_TOKEN" || { echo "ZE_CI_TOKEN secret is not set"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Zephyr reads git metadata (org, project, branch)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The remotes must be deployed first so the shell can resolve it.
      - name: Build and deploy auth
        run: npm run build -w auth

      - name: Build and deploy feed
        run: npm run build -w feed

      - name: Build and deploy composer
        run: npm run build -w composer

      - name: Build and deploy shell
        env:
          # Pushes land in staging. Run the workflow manually to deploy to production.
          # Deploying through CI (not only promoting in the dashboard) is what writes the
          # remote dependencies into the environment manifest.
          ZE_ENV: ${{ inputs.environment || 'staging' }}
          # Build-time fallback only. Each environment overrides it in the Zephyr dashboard.
          ZE_PUBLIC_API_URL: https://zephyr-mf-demo-api-staging.onrender.com
        run: npm run build -w shell
